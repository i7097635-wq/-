<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>正方形コラージュ </title>
<style>
    body { font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
    .controls { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 10px; }
    #editor-container { box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: black; line-height: 0; }
    .grid { display: grid; gap: 0px; }
    .grid.layout-3x3 { grid-template-columns: repeat(3, 200px); grid-template-rows: repeat(3, 200px); }
    .grid.layout-2x2 { grid-template-columns: repeat(2, 300px); grid-template-rows: repeat(2, 300px); }
    .cell { background-color: #ddd; position: relative; overflow: hidden; cursor: grab; user-select: none; }
    .cell.dragging { cursor: grabbing; }
    .placeholder { pointer-events: none; color: #999; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .cell canvas { position: absolute; top: 0; left: 0; cursor: move; display: none; transform-origin: 0 0; }
    #saveBtn { background: #28a745; color: white; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<h1>コラージュメーカー</h1>
<div class="controls">
    <button onclick="setLayout('3x3')">3x3</button>
    <button onclick="setLayout('2x2')">2x2</button>
    <button onclick="location.reload()">リセット</button>
</div>
<p>ドラッグで位置調整 | ホイールで拡大 </p>

<div id="editor-container">
    <div id="grid" class="grid layout-3x3"></div>
</div>
<button id="saveBtn" onclick="generateHighResImage()">高画質で保存 (PNG)</button>

<script>
    let currentLayout = '3x3';
    let cellsData = [];
    const CELL_PX = 200; // プレビュー時の1マスサイズ

    function setLayout(type) {
        currentLayout = type;
        document.getElementById('grid').className = `grid layout-${type}`;
        createCells();
    }

    function createCells() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        const count = currentLayout === '3x3' ? 9 : 4;
        cellsData = [];
        for(let i=0; i<count; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerHTML = '<div class="placeholder">+</div>';
            cellsData[i] = { img:null, x:0, y:0, scale:1, canvas:null };
            setupCell(cell, i);
            grid.appendChild(cell);
        }
    }

    function setupCell(cell, i) {
        cell.addEventListener('click', (e) => {
            if(cellsData[i].img) return;
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                if(e.target.files[0]) loadImage(e.target.files[0], i, cell);
            };
            input.click();
        });
        
        let isDrag = false;
        cell.addEventListener('mousedown', (e) => { isDrag = true; cell.classList.add('dragging'); });
        window.addEventListener('mousemove', (e) => {
            if(!isDrag || !cellsData[i].img) return;
            const d = cellsData[i];
            d.x += e.movementX; d.y += e.movementY;
            applyConstraint(d, CELL_PX);
            draw(i);
        });
        window.addEventListener('mouseup', () => { isDrag = false; cell.classList.remove('dragging'); });
        
        cell.addEventListener('wheel', (e) => {
            if(!cellsData[i].img) return;
            e.preventDefault();
            const d = cellsData[i];
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            d.scale *= factor;
            applyConstraint(d, CELL_PX);
            draw(i);
        }, {passive:false});
    }

    function loadImage(file, i, cell) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                cellsData[i].img = img;
                cell.querySelector('.placeholder').style.display = 'none';
                // Cover設定
                const ratio = Math.max(CELL_PX / img.width, CELL_PX / img.height);
                cellsData[i].scale = ratio;
                cellsData[i].x = (CELL_PX - img.width * ratio) / 2;
                cellsData[i].y = (CELL_PX - img.height * ratio) / 2;
                
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                canvas.style.display = 'block';
                cellsData[i].canvas = canvas;
                cell.appendChild(canvas);
                draw(i);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function applyConstraint(d, size) {
        const imgW = d.img.width * d.scale;
        const imgH = d.img.height * d.scale;
        // 最小スケール制限（枠より小さくならないように）
        if(imgW < size) { d.scale = size / d.img.width; }
        if(imgH < size) { d.scale = size / d.img.height; }
        
        // 位置制限（端が見えないように）
        d.x = Math.min(0, Math.max(d.x, size - (d.img.width * d.scale)));
        d.y = Math.min(0, Math.max(d.y, size - (d.img.height * d.scale)));
    }

    function draw(i) {
        const d = cellsData[i];
        d.canvas.style.transform = `translate(${d.x}px, ${d.y}px) scale(${d.scale})`;
    }

    function generateHighResImage() {
        const size = 1500; // 出力サイズ
        const canvas = document.createElement('canvas');
        const count = currentLayout === '3x3' ? 3 : 2;
        canvas.width = canvas.height = size * count;
        const ctx = canvas.getContext('2d');
        
        cellsData.forEach((d, i) => {
            if(!d.img) return;
            const x = (i % count) * size;
            const y = Math.floor(i / count) * size;
            const ratio = size / CELL_PX;
            ctx.drawImage(d.img, d.x * ratio, d.y * ratio, d.img.width * d.scale * ratio, d.img.height * d.scale * ratio, x, y, size, size);
        });
        const link = document.createElement('a');
        link.download = 'collage.png';
        link.href = canvas.toDataURL();
        link.click();
    }

    createCells();
</script>
</body>
</html>
