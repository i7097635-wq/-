        // --- ローカル管理（リベンジモード用） ---
        function getLocalRevengeList() {
            return JSON.parse(localStorage.getItem('quiz_revenge_ids') || '[]');
        }

        function addLocalRevenge(qId) {
            let list = getLocalRevengeList();
            if (!list.includes(qId)) {
                list.push(qId);
                localStorage.setItem('quiz_revenge_ids', JSON.stringify(list));
            }
        }

        function removeLocalRevenge(qId) {
            let list = getLocalRevengeList();
            list = list.filter(id => id !== qId);
            localStorage.setItem('quiz_revenge_ids', JSON.stringify(list));
        }

        function toggleModeOptions() {
            const mode = document.getElementById('modeSelect').value;
            const diffGroup = document.getElementById('diffGroup');
            const rangeGroup = document.getElementById('rangeGroup');
            if (mode === 'revenge' || mode === 'hardcore') {
                diffGroup.classList.add('hidden');
                rangeGroup.classList.add('hidden');
            } else if (mode.includes('timeattack') || mode.includes('endless')) {
                diffGroup.classList.add('hidden');
                rangeGroup.classList.add('hidden');
            } else {
                diffGroup.classList.remove('hidden');
                rangeGroup.classList.remove('hidden');
            }
        }

        function getVolumeNumber(rangeStr) {
            if (!rangeStr) return -1;
            if (rangeStr.includes("その他")) return 999;
            let match = rangeStr.match(/^(\d+)(上巻|下巻)?/);
            if (match) return parseInt(match[1], 10);
            return -1;
        }

        function isRangeMatch(questionRange, selectedRange) {
            if (questionRange === "") return (selectedRange === "全範囲" || selectedRange === "1巻～17巻");
            if (selectedRange === '全範囲') return true;
            if (questionRange === selectedRange) return true;
            if (questionRange.includes("その他") || selectedRange.includes("その他")) return questionRange === selectedRange;
            
            let qVol = getVolumeNumber(questionRange);
            if (qVol === 999 || qVol === -1) return false;
            if (selectedRange === '1巻～17巻') return qVol >= 1 && qVol <= 17;
            return false;
        }

                        data.forEach(row => {

                startEndlessTimer();
            }

            loadQuestion();
        }

        function startTimerCounter() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeElapsed++;
                document.getElementById('timerDisplay').innerText = `経過時間: ${timeElapsed}秒`;
            }, 1000);
        }

        function startEndlessTimer() {
            clearInterval(timer);
            document.getElementById('timerDisplay').innerText = `残り時間: ${timeLeft}秒`;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = `残り時間: ${timeLeft}秒`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endEndlessQuiz();
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentMode.includes('endless') && currentList.length <= currentIndex) {
                currentList.sort(() => Math.random() - 0.5);
                currentIndex = 0;
            }

            const q = currentList[currentIndex];
            if (currentMode.includes('timeattack') || currentMode.includes('revenge') || currentMode.includes('hardcore') || currentMode === 'normal') {
                document.getElementById('progressText').innerText = `第 ${currentIndex + 1} 問 / 全 ${currentList.length} 問`;
            } else {
                document.getElementById('progressText').innerText = `得点ポイント: ${score} pt`;
            }
            
            let rangeDisplay = q.range ? q.range : "非公開";
            document.getElementById('metaInfo').innerText = `[難易度: ${q.difficulty} / 範囲: ${rangeDisplay}]`;
            document.getElementById('questionText').innerText = q.question;
            
            const descArea = document.getElementById('descArea');
            const choiceArea = document.getElementById('choiceArea');
            const feedbackArea = document.getElementById('feedbackArea');
            const skipBtn = document.getElementById('skipBtn');
            const nextBtn = document.getElementById('nextBtn');

            feedbackArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            skipBtn.classList.remove('hidden');

            if (q.type === 'choice') {
                descArea.classList.add('hidden');
                choiceArea.classList.remove('hidden');
                choiceArea.innerHTML = '';
                q.choices.forEach(choiceText => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = choiceText;
                    btn.onclick = () => checkAnswer(choiceText, q);
                    choiceArea.appendChild(btn);
                });
            } else {
                choiceArea.classList.add('hidden');
                descArea.classList.remove('hidden');
                const inputBox = document.getElementById('userAnswer');
                inputBox.value = '';
                inputBox.disabled = false;
                document.getElementById('submitBtn').classList.remove('hidden');
            }
        }

        function checkDescAnswer() {
            const userAns = document.getElementById('userAnswer').value.trim();
            if (!userAns) {
                alert('答えを入力してください');
                return;
            }
            const q = currentList[currentIndex];
            checkAnswer(userAns, q);
        }

        async function checkAnswer(selectedChoice, q) {
            const isCorrect = (selectedChoice === q.answer);

            // 1. ローカル管理（リベンジ用）の更新
            if (isCorrect) {
                removeLocalRevenge(q.id);
            } else {
                addLocalRevenge(q.id);
            }

            // 2. インターネット共通管理（全体正答率用）の更新をSupabaseに送信
            updateGlobalStatsInSupabase(q.id, isCorrect);

            if (isCorrect) {
                correctCount++;
                if (currentMode.includes('endless')) {
                    if (q.difficulty === '簡単') score += 1;
                    else if (q.difficulty === '普通') score += 3;
                    else if (q.difficulty === '難しい') score += 5;

                    if (q.difficulty === '簡単') timeLeft += 3;
                    else if (q.difficulty === '普通') timeLeft += 5;
                    else if (q.difficulty === '難しい') timeLeft += 10;
                } else {
                    score++;
                }
            } else {
                if (currentMode.includes('endless')) {
                    if (q.difficulty === '簡単') timeLeft -= 10;
                    else if (q.difficulty === '普通') timeLeft -= 5;
                    else if (q.difficulty === '難しい') timeLeft -= 3;
                    if (timeLeft < 0) timeLeft = 0;
                }
            }

            if (q.type === 'choice') {
                const buttons = document.querySelectorAll('#choiceArea button');
                buttons.forEach(btn => btn.disabled = true);
            } else {
                document.getElementById('userAnswer').disabled = true;
                document.getElementById('submitBtn').classList.add('hidden');
            }

            showFeedback(isCorrect, q);
        }

        async function updateGlobalStatsInSupabase(qId, isCorrect) {
            try {
                // 既存の全体データを取得
                const { data } = await supabaseClient
                    .from('global_quiz_stats')
                    .select('*')
                    .eq('question_id', qId)
                    .single();

                let total = 1;
                let correct = isCorrect ? 1 : 0;
                let incorrect = isCorrect ? 0 : 1;

                if (data) {
                    total = data.total + 1;
                    correct = data.correct + (isCorrect ? 1 : 0);
                    incorrect = data.incorrect + (isCorrect ? 0 : 1);
                }

                await supabaseClient
                    .from('global_quiz_stats')
                    .upsert({
                        question_id: qId,
                        total: total,
                        correct: correct,
                        incorrect: incorrect,
                        updated_at: new Date()
                    }, { onConflict: 'question_id' });
            } catch (e) {
                console.error("Global stats update error:", e);
            }
        }

        function skipQuestion() {
            const q = currentList[currentIndex];
            addLocalRevenge(q.id);
            updateGlobalStatsInSupabase(q.id, false);

            if (currentMode.includes('timeattack')) {
                timeElapsed += 5;
            } else if (currentMode.includes('endless')) {
                timeLeft -= 5;
                if (timeLeft < 0) timeLeft = 0;
            }

            if (q.type === 'choice') {
                const buttons = document.querySelectorAll('#choiceArea button');
                buttons.forEach(btn => btn.disabled = true);
            } else {
                document.getElementById('userAnswer').disabled = true;
                document.getElementById('submitBtn').classList.add('hidden');
            }

            const feedback = document.getElementById('feedbackArea');
            feedback.className = `feedback incorrect`;
            feedback.innerHTML = `スキップしました<br><strong>正解:</strong> ${q.answer}<br><strong>解説:</strong> ${q.explanation}`;
            feedback.classList.remove('hidden');

            document.getElementById('skipBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function showFeedback(isCorrect, q) {
            const feedback = document.getElementById('feedbackArea');
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.innerHTML = `<strong>${isCorrect ? '正解！' : '不正解...'}</strong><br><strong>正解:</strong> ${q.answer}<br><strong>解説:</strong> ${q.explanation}`;
            feedback.classList.remove('hidden');

            document.getElementById('skipBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentMode.includes('endless') && timeLeft <= 0) {
                endEndlessQuiz();
                return;
            }

            currentIndex++;
            if (currentMode.includes('timeattack') && currentIndex >= 10) {
                endTimerQuiz();
                return;
            }

            if (currentIndex < currentList.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function endTimerQuiz() {
            clearInterval(timer);
            saveScoreToSupabase(currentMode, currentNickname, timeElapsed);
            showResult();
        }

        function endEndlessQuiz() {
            clearInterval(timer);
            saveScoreToSupabase(currentMode, currentNickname, score);
            showResult();
        }

        function showResult() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            document.getElementById('resultNickname').innerText = currentNickname;
            document.getElementById('resultModeName').innerText = document.getElementById('modeSelect').options[document.getElementById('modeSelect').selectedIndex].text;

            if (currentMode.includes('timeattack')) {
                document.getElementById('resultDetailText').innerHTML = `<strong>クリアタイム:</strong> ${timeElapsed} 秒`;
                document.getElementById('scoreText').innerText = `正答数: ${score} / ${currentList.length} 問`;
            } else if (currentMode.includes('endless')) {
                document.getElementById('resultDetailText').innerHTML = `<strong>獲得ポイント:</strong> ${score} pt`;
                document.getElementById('scoreText').innerText = `正解数: ${correctCount} 問`;
            } else {
                const rate = Math.round((score / currentList.length) * 100);
                document.getElementById('resultDetailText').innerHTML = ``;
                document.getElementById('scoreText').innerText = `正答数: ${score} / ${currentList.length} 問 (${rate}%)`;
            }
        }

        async function saveScoreToSupabase(mode, nickname, val) {
            try {
                await supabaseClient.from('rankings').insert([
                    { mode: mode, nickname: nickname, score: val, created_at: new Date() }
                ]);
            } catch (e) {
                console.error("Supabase ranking save error:", e);
            }
        }

        function showRankingMenu() {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('rankingScreen').classList.remove('hidden');
            loadRankingData();
        }

        async function loadRankingData() {
            const rankingType = document.getElementById('rankingTypeSelect').value;
            const container = document.getElementById('rankingContent');
            container.innerHTML = '読み込み中...';

            try {
                const { data, error } = await supabaseClient
                    .from('rankings')
                    .select('*')
                    .eq('mode', rankingType)
                    .order('score', { ascending: rankingType.includes('timeattack') ? true : false })
                    .limit(10);

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; margin-top:15px;">ランキングデータがまだありません。</p>';
                    return;
                }

                let html = `<table class="ranking-table"><tr><th>順位</th><th>ニックネーム</th><th>${rankingType.includes('timeattack') ? 'タイム' : 'ポイント'}</th></tr>`;
                data.forEach((row, index) => {
                    html += `<tr><td>${index + 1}</td><td>${row.nickname}</td><td>${row.score} ${rankingType.includes('timeattack') ? '秒' : 'pt'}</td></tr>`;
                });
                html += `</table>`;
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<p style="text-align:center; color:red; margin-top:15px;">ランキングの取得に失敗しました。<br>（Supabaseの接続設定を確認してください）</p>';
            }
        }

        function resetQuiz() {
            clearInterval(timer);
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('rankingScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
