<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>括弧の形式変換ツール</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p.description {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-direction: column;
        }
        @media(min-width: 600px) {
            .container {
                flex-direction: row;
            }
        }
        .box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }
        .button-area {
            text-align: center;
            margin: 15px 0;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .copy-btn {
            background-color: #28a745;
            margin-top: 5px;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>括弧の形式変換ツール</h1>
    <p class="description">例: <code>＜思念通信リークス＞</code> を <code>《思念通信》(リークス)</code> に変換します（カタカナ部分を後ろの丸括弧に分離します）。</p>

    <div class="container">
        <div class="box">
            <label for="input-text">変換前（入力）</label>
            <textarea id="input-text" placeholder="例:
＜思念通信リークス＞"></textarea>
        </div>
        
        <div class="box">
            <label for="output-text">変換後（出力）</label>
            <textarea id="output-text" placeholder="ここに結果が表示されます" readonly></textarea>
            <button class="copy-btn" onclick="copyToClipboard()">結果をコピー</button>
        </div>
    </div>

    <div class="button-area">
        <button onclick="convertText()">変換する</button>
    </div>

    <script>
        function convertText() {
            const input = document.getElementById('input-text').value;
            const lines = input.split('\n');
            
            const convertedLines = lines.map(line => {
                // ＜ または [ などの括弧で囲まれた中身をキャプチャする正規表現
                // 例: ＜思念通信リークス＞ から 「思念通信リークス」 を取り出す
                return line.replace(/[＜［\[（(【『「]([^＞］］）)】』」]+)[＞］］）)】』」]/g, (match, innerText) => {
                    
                    // 中身の文字列から、末尾に続く「連続するカタカナ（長音符や中黒含む）」を抽出する正規表現
                    // 例: 「思念通信リークス」 -> 前半「思念通信」、後半「リークス」
                    // ※カタカナ、長音(ー)、中黒(・)、スペース等をカタカナ判定に含める
                    const matchKana = innerText.match(/^(.*?)([ァ-ヶー・\s]+)$/);
                    
                    if (matchKana) {
                        const kanjiPart = matchKana[1]; // 漢字など（または漢字+ひらがな等）
                        const kanaPart = matchKana[2];   // カタカナ部分
                        
                        // 《漢字》 (カタカナ) の形に組み立てる
                        return `《${kanjiPart}》(${kanaPart})`;
                    }
                    
                    // カタカナが綺麗に分離できない場合はそのまま返す（または 《》 で囲む）
                    return `《${innerText}》`;
                });
            });
            
            document.getElementById('output-text').value = convertedLines.join('\n');
        }

        function copyToClipboard() {
            const outputText = document.getElementById('output-text');
            outputText.select();
            document.execCommand('copy');
            alert('クリップボードにコピーしました！');
        }
    </script>

</body>
</html>
