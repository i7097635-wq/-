<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>魔王学院の不適合者クイズ</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 650px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.5;
            -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを抑制して快適に */
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 { font-size: 1.3rem; margin-top: 0; color: #0056b3; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            touch-action: manipulation; /* スマホでのタップ遅延を防ぎ反応を良くする */
        }
        button:active { opacity: 0.8; }
        .choice-btn {
            background-color: #e2e8f0;
            color: #1e293b;
            font-weight: bold;
            margin-bottom: 8px;
            border: 1px solid #cbd5e1;
            text-align: left;
            padding: 12px 15px;
        }
        .choice-btn:hover { background-color: #cbd5e1; }
        .skip-btn {
            background-color: #6c757d;
        }
        .hidden { display: none !important; }
        .feedback { margin-top: 15px; padding: 12px; border-radius: 4px; }
        .correct { background-color: #d4edda; color: #155724; }
        .incorrect { background-color: #f8d7da; color: #721c24; }
        .progress { font-size: 0.85rem; color: #666; margin-bottom: 10px; text-align: right; }
    </style>
</head>
<body>

    <div class="card" id="setupScreen">
        <h1>作魔王学院の不適合者クイズ</h1>
        <div class="form-group">
            <label>難易度選択</label>
            <select id="diffSelect">
                <option value="全て">全て</option>
                <option value="簡単">簡単</option>
                <option value="普通">普通</option>
                <option value="難しい">難しい</option>
            </select>
        </div>
        <div class="form-group">
            <label>出題範囲選択</label>
            <select id="rangeSelect">
                <option value="全範囲">全範囲</option>
                <option value="1巻">1巻</option>
                <option value="2巻">2巻</option>
                <option value="3巻">3巻</option>
                <option value="4上巻">4上巻</option>
                <option value="4下巻">4下巻</option>
                <option value="4巻（上下巻両方）">4巻（上下巻両方）</option>
                <option value="5巻">5巻</option>
                <option value="6巻">6巻</option>
                <option value="7巻">7巻</option>
                <option value="8巻">8巻</option>
                <option value="9巻">9巻</option>
                <option value="10上巻">10上巻</option>
                <option value="10下巻">10下巻</option>
                <option value="10巻（上下巻両方）">10巻（上下巻両方）</option>
                <option value="11巻">11巻</option>
                <option value="12上巻">12上巻</option>
                <option value="12下巻">12下巻</option>
                <option value="12巻（上下巻両方）">12巻（上下巻両方）</option>
                <option value="13上巻">13上巻</option>
                <option value="13下巻">13下巻</option>
                <option value="13巻（上下巻両方）">13巻（上下巻両方）</option>
                <option value="14上巻">14上巻</option>
                <option value="14巻下">14巻下</option>
                <option value="14巻（上下巻両方）">14巻（上下巻両方）</option>
                <option value="15巻">15巻</option>
                <option value="16巻">16巻</option>
                <option value="17巻">17巻</option>
                <option value="1巻～4下巻">1巻～4下巻</option>
                <option value="5巻～8巻">5巻～8巻</option>
                <option value="9巻～10下巻">9巻～10下巻</option>
                <option value="1巻～10下巻">1巻～10下巻</option>
                <option value="11巻～17巻">11巻～17巻</option>
                <option value="1巻～17巻">1巻～17巻</option>
                <option value="その他（アンソロジー、画集、ラジオ、イベント、Xなど）">その他（アンソロジー、画集、ラジオ、イベント、Xなど）</option>
            </select>
        </div>
        <button onclick="startQuiz()">クイズスタート</button>
    </div>

    <div class="card hidden" id="quizScreen">
        <div class="progress" id="progressText">第 1 問 / 全 10 問</div>
        <p style="font-size: 0.85rem; color: #555;" id="metaInfo"></p>
        <h2 id="questionText" style="font-size: 1.1rem; margin-bottom: 15px;"></h2>
        
        <div id="descArea" class="form-group">
            <input type="text" id="userAnswer" placeholder="答えを入力してください">
            <button id="submitBtn" onclick="checkDescAnswer()">回答する</button>
        </div>

        <div id="choiceArea" class="form-group hidden">
            </div>

        <button id="skipBtn" class="skip-btn" onclick="skipQuestion()">この問題をスキップ</button>
        <div id="feedbackArea" class="feedback hidden"></div>
        <button id="nextBtn" class="hidden" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <div class="card hidden" id="resultScreen">
        <h1>結果発表</h1>
        <div style="background: #f8fafc; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; color: #475569;">
            <p style="margin: 0 0 5px 0;"><strong>選択難易度:</strong> <span id="resultDiff"></span></p>
            <p style="margin: 0;"><strong>出題範囲:</strong> <span id="resultRange"></span></p>
        </div>
        <p id="scoreText" style="font-size: 1.2rem; text-align: center; font-weight: bold; margin: 15px 0;"></p>
        <button onclick="resetQuiz()">最初に戻る</button>
    </div>

    <script>
        // ==========================================
        // 【クイズデータの追加・編集エリア】
        // type: "desc" (記述) / "choice" (選択)
        // ==========================================
            const quizData = [
    // 【例1：記述式問題の書き方】
    { 
        type: "desc",                               // 記述式は "desc"
        question: "1主人公のフルネームは？",            // 問題文
        answer: "アノス・ヴォルディゴード",                           // 正解の答え
        range: "1巻",                               // 出題範囲（※選択肢にある名称）
        difficulty: "簡単",                         // 難易度（簡単 / 普通 / 難しい）
        explanation: "常識です。" // 解説
    },

    // 【例2：選択問題の書き方】
    { 
        type: "choice",                             // 選択式は "choice"
        question: "作者である秋の読み方は？", // 問題文
        choices: ["アキ", "シュウ", "とき", "読みはない"], // 選択肢の配列（いくつでもOK）
        answer: "しゅう",                           // 選択肢の中にある「正解のテキスト」
        range: "その他（アンソロジー、画集、ラジオ、イベント、Xなど）",                               // 出題範囲
        difficulty: "簡単",                         // 難易度
        explanation: "秋さんも忘れており、打ち合わせの際はアキですと言ってしまったことがあるそう。" // 解説
    }
];

        function getVolumeNumber(rangeStr) {
            if (!rangeStr) return -1;
            if (rangeStr.includes("その他")) return 999;
            
            let match = rangeStr.match(/^(\d+)(上巻|下巻|巻下)?/);
            if (match) {
                return parseInt(match[1], 10);
            }
            return -1;
        }

        function isRangeMatch(questionRange, selectedRange) {
            if (selectedRange === '全範囲') return true;
            if (questionRange === selectedRange) return true;

            if (questionRange.includes("その他") || selectedRange.includes("その他")) {
                return questionRange === selectedRange;
            }

            if (selectedRange.includes('巻（上下巻両方）')) {
                let baseMatch = selectedRange.match(/^(\d+)巻/);
                if (baseMatch) {
                    let baseNum = parseInt(baseMatch[1], 10);
                    let qMatch = questionRange.match(/^(\d+)/);
                    if (qMatch && parseInt(qMatch[1], 10) === baseNum) return true;
                }
            }

            let qVol = getVolumeNumber(questionRange);
            if (qVol === 999 || qVol === -1) return false;

            if (selectedRange === '1巻～4下巻') return qVol >= 1 && qVol <= 4;
            if (selectedRange === '5巻～8巻') return qVol >= 5 && qVol <= 8;
            if (selectedRange === '9巻～10下巻') return qVol >= 9 && qVol <= 10;
            if (selectedRange === '1巻～10下巻') return qVol >= 1 && qVol <= 10;
            if (selectedRange === '11巻～17巻') return qVol >= 11 && qVol <= 17;
            if (selectedRange === '1巻～17巻') return qVol >= 1 && qVol <= 17;

            return false;
        }

        let currentList = [];
        let currentIndex = 0;
        let score = 0;
        let selectedDiff = '';
        let selectedRange = '';

        function startQuiz() {
            selectedDiff = document.getElementById('diffSelect').value;
            selectedRange = document.getElementById('rangeSelect').value;

            currentList = quizData.filter(q => {
                const diffMatch = (selectedDiff === '全て' || q.difficulty === selectedDiff);
                const rangeMatch = isRangeMatch(q.range, selectedRange);
                return diffMatch && rangeMatch;
            });

            if (currentList.length === 0) {
                alert('条件に一致するクイズがありません！\n（※選択した範囲・難易度の問題データがまだ追加されていない可能性があります）');
                return;
            }

            currentList.sort(() => Math.random() - 0.5);
            currentList = currentList.slice(0, 10);

            currentIndex = 0;
            score = 0;

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = currentList[currentIndex];
            document.getElementById('progressText').innerText = `第 ${currentIndex + 1} 問 / 全 ${currentList.length} 問`;
            document.getElementById('metaInfo').innerText = `[難易度: ${q.difficulty} / 範囲: ${q.range}]`;
            document.getElementById('questionText').innerText = q.question;
            
            const descArea = document.getElementById('descArea');
            const choiceArea = document.getElementById('choiceArea');
            const feedbackArea = document.getElementById('feedbackArea');
            const skipBtn = document.getElementById('skipBtn');
            const nextBtn = document.getElementById('nextBtn');

            feedbackArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            skipBtn.classList.remove('hidden');

            if (q.type === 'choice') {
                descArea.classList.add('hidden');
                choiceArea.classList.remove('hidden');
                choiceArea.innerHTML = '';

                q.choices.forEach(choiceText => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = choiceText;
                    btn.onclick = () => checkChoiceAnswer(choiceText);
                    choiceArea.appendChild(btn);
                });
            } else {
                choiceArea.classList.add('hidden');
                descArea.classList.remove('hidden');
                document.getElementById('userAnswer').value = '';
                document.getElementById('userAnswer').disabled = false;
                document.getElementById('submitBtn').classList.remove('hidden');
            }
        }

        function checkDescAnswer() {
            const userAns = document.getElementById('userAnswer').value.trim();
            if (!userAns) {
                alert('答えを入力してください');
                return;
            }

            const q = currentList[currentIndex];
            const isCorrect = (userAns === q.answer);
            if (isCorrect) score++;

            document.getElementById('userAnswer').disabled = true;
            document.getElementById('submitBtn').classList.add('hidden');
            showFeedback(isCorrect, q);
        }

        function checkChoiceAnswer(selectedChoice) {
            const q = currentList[currentIndex];
            const isCorrect = (selectedChoice === q.answer);
            if (isCorrect) score++;

            const buttons = document.querySelectorAll('#choiceArea button');
            buttons.forEach(btn => btn.disabled = true);

            showFeedback(isCorrect, q);
        }

        function skipQuestion() {
            const q = currentList[currentIndex];
            
            if (q.type === 'choice') {
                const buttons = document.querySelectorAll('#choiceArea button');
                buttons.forEach(btn => btn.disabled = true);
            } else {
                document.getElementById('userAnswer').disabled = true;
                document.getElementById('submitBtn').classList.add('hidden');
            }

            const feedback = document.getElementById('feedbackArea');
            feedback.className = `feedback incorrect`;
            feedback.innerHTML = `<strong>スキップしました（不正解扱い）</strong><br>正解: ${q.answer}<br>解説: ${q.explanation}`;
            feedback.classList.remove('hidden');

            document.getElementById('skipBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function showFeedback(isCorrect, q) {
            const feedback = document.getElementById('feedbackArea');
            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.innerHTML = `<strong>${isCorrect ? '正解！' : '不正解...'}</strong><br>正解: ${q.answer}<br>解説: ${q.explanation}`;
            feedback.classList.remove('hidden');

            document.getElementById('skipBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentList.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            
            document.getElementById('resultDiff').innerText = selectedDiff;
            document.getElementById('resultRange').innerText = selectedRange;

            const rate = Math.round((score / currentList.length) * 100);
            document.getElementById('scoreText').innerText = `正答数: ${score} / ${currentList.length} 問 (${rate}%)`;
        }

        function resetQuiz() {
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
