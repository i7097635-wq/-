    <style>

            margin: 20px auto;

            background-color: #f4f4f9;
            color: #333;
            line-height: 1.5;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            color: #0056b3;
        }
        p.description {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button.action-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button.action-btn:hover {
            background-color: #0056b3;
        }
        /* --- 選択肢（候補ボタン）のデザイン（背景白・文字黒） --- */
        .candidate {
            display: block;
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            margin-bottom: 6px;
            cursor: pointer;
            text-align: left;
            background: #ffffff; /* 背景：白 */
            color: #000000;     /* 文字：黒 */
            font-size: 1rem;
            border-radius: 6px;
            transition: background 0.15s, border-color 0.15s;
        }
        .candidate:hover {
            background: #f1f5f9; /* マウスを乗せたとき：薄いグレー */
            border-color: #94a3b8;
        }
        #results {
            max-height: 250px;
            overflow-y: auto;
            margin-top: 10px;
        }
    </style>
</head>

    <!-- 機能1：括弧の形式変換 -->
    <div class="card">
        <h1>1. なろう括弧形式変換ツール</h1>
        <p class="description">例: <code>＜思念通信リークス＞</code> を <code>《思念通信》(リークス)</code> に一括変換します。</p>
        <textarea id="bracketInput" placeholder="ここに変換したいテキストを入力（複数行可）"></textarea>
        <button class="action-btn" onclick="convertBrackets()">変換してコピー</button>
    </div>

        <h1>2. Wikiリンク生成ツール</h1>
        <p class="description">名前やキーワードの一部を入力すると、紐づいた正式名称で <code>[[入力>正式名称]]</code> を生成します。リストにない言葉でもそのまま出力できます。</p>

        <div id="results"></div>
    </div>

        // 機能1：括弧変換のスクリプト

        function convertBrackets() {
            const input = document.getElementById('bracketInput').value;
            const lines = input.split('\n');
            
            const convertedLines = lines.map(line => {
                return line.replace(/[＜［\[（(【『「]([^＞］］）』」]+)[＞］］）』」]/g, (match, innerText) => {
                    const matchKana = innerText.match(/^(.*?)([ァ-ヶー・\s]+)$/);
                    if (matchKana) {
                        return `《${matchKana[1]}》(${matchKana[2]})`;
                    }
                    return `《${innerText}》`;
                });
            });
            
            const resultText = convertedLines.join('\n');
            navigator.clipboard.writeText(resultText);
            alert('変換してクリップボードにコピーしました！\n\n' + resultText);
        }

        // ==========================================
        // 機能2：名前リンク生成のスクリプト（処理）
        // ==========================================
        function updateList() {
            const input = document.getElementById('searchInput').value.trim();
            const results = document.getElementById('results');
            results.innerHTML = '';
            if (!input) return;

            // キーワード（key）または正式名称（val）の一部に一致するものを検索
            const matches = nameData.filter(d => d.key.includes(input) || d.val.includes(input));
            
            // 一致した候補をボタンとして表示
            matches.forEach(d => {
                addBtn(input, d.val);
            });

            // リストに完全一致するものがない場合や、入力した文字をそのまま使いたい場合のために追加
            if (!matches.some(d => d.val === input)) {
                addBtn(input, input);
            }
        }

        function addBtn(input, formalName) {
            const btn = document.createElement('button');
            btn.className = 'candidate';
            btn.innerText = `[[${input}>${formalName}]]`;
            btn.onclick = () => {
                navigator.clipboard.writeText(`[[${input}>${formalName}]]`);
                alert("コピーしました: " + `[[${input}>${formalName}]]`);
            };
            results.appendChild(btn);
        }
    </script>
