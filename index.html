<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Wikiリンク生成ツール</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
        input { width: 100%; padding: 10px; font-size: 1rem; box-sizing: border-box; }
        #results { margin-top: 20px; }
        .candidate { 
            display: block; padding: 10px; border-bottom: 1px solid #eee; 
            cursor: pointer; background: #fff; text-align: left; width: 100%; border: none;
        }
        .candidate:hover { background: #f0f0f0; }
        .copy-hint { color: #666; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Wikiリンク生成</h2>
    <input type="text" id="searchInput" placeholder="名前の一部を入力..." oninput="updateCandidates()">
    <div id="results"></div>
</div>

<script>
    // 【編集はこちら】ここに正式名称を追加してください
    const nameList = [
        "魔族", "魔王族", "皇魔族", "ツェイロンの魔族", "人間", "神族", "精霊", "半霊半魔", "半人半魔", "半神半魔",
        "竜人", "子竜", "幻魔族", "幻獣", "城魔族", "転生世界ミリティア", "魔界", "魔族の国ディルヘイド",
        "魔王学院デルゾゲード", "ログノース魔法医院", "地下迷宮ゴラヌヘリア", "人間界", "アゼシオン",
        "インズエル", "王都ガイラディーテ", "勇者学院アルクランイスカ", "精霊界", "精霊の学舎",
        "神々の蒼穹", "地底世界", "王竜の国アガハ", "神竜の国ジオルダル", "聖都ガエラヘスタ",
        "神代の学府エーベラストアンゼッタ", "覇竜の国ガデイシオラ", "アイシャ", "アノス・ヴォルディゴード"
        // 必要に応じてここに追加してください
    ];

    function updateCandidates() {
        const input = document.getElementById('searchInput').value;
        const results = document.getElementById('results');
        results.innerHTML = '';

        if (!input) return;

        // 一致する候補を探す
        const matches = nameList.filter(name => name.includes(input));

        // リストに一致するものがある場合
        matches.forEach(name => {
            addResultButton(input, name);
        });

        // リストにない場合や、あえてそのままコピーしたい場合のための選択肢
        addResultButton(input, input);
    }

    function addResultButton(input, formalName) {
        const btn = document.createElement('button');
        btn.className = 'candidate';
        btn.innerHTML = `[[${input}>${formalName}]]`;
        btn.onclick = () => {
            navigator.clipboard.writeText(`[[${input}>${formalName}]]`);
            alert(`コピーしました: [[${input}>${formalName}]]`);
        };
        document.getElementById('results').appendChild(btn);
    }
</script>

</body>
</html>
